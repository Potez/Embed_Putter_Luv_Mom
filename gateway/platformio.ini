; RoomSense gateway — ESP32-WROOM DevKit
[env:gateway]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; app partition 1.9 MB (Flame's RandomForest weights are const in flash, ~62 KB source)
board_build.partitions = min_spiffs.csv

lib_deps =
    madhephaestus/ESP32Servo
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor
    bblanchon/ArduinoJson@^7

; Shared packet struct + Flame's predictor are REFERENCED from the repo (not copied):
;   firmware/shared/packets.h
;   Roomsense_dataset/src/predictor_class/RoomSensePredictor/RoomSensePredictor.h
;   Roomsense_dataset/src/predictor_class/RoomSensePredictor/model_weights.h
; REQUIRE_PREDICTOR=1 -> compile error if the model header is not found (no silent fallback).
build_flags =
    -I$PROJECT_DIR/../shared
    -I$PROJECT_DIR/../../Roomsense_dataset/src/predictor_class/RoomSensePredictor
    -DREQUIRE_PREDICTOR=1
; set to 0 for real sensors/servo (or edit src/config.h)
;   -DMOCK_SENSORS=0
